<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // aplica o tema antes de desenhar a tela (evita piscar escuro no modo claro)
      try {
        var t = localStorage.getItem("vox-tema");
        var claro = t === "claro" || (t === "sistema" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.tema = claro ? "claro" : "escuro";
      } catch (e) { document.documentElement.dataset.tema = "escuro"; }
    </script>
    <meta name="theme-color" content="#15130f" />
    <title>Fluxo operacional | Vox FIDC</title>

  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
